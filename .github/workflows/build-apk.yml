name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets & Install Dependencies
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.js www/ 2>/dev/null || true
          cp -r *.css www/ 2>/dev/null || true
          cp -r *.png www/ 2>/dev/null || true
          npm ci || npm install
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Assets (If present)
        run: |
          if [ -d "assets" ]; then
            npx @capacitor/assets generate --android || echo "Asset generation failed, continuing..."
          else
            echo "No assets folder found, skipping icon generation."
          fi

      - name: Sync Capacitor Platform
        run: |
          npx cap copy android
          npx cap sync android

      - name: Fix Kotlin Duplicate Dependencies
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            cat << 'EOF' >> $BUILD_GRADLE

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      dependencySubstitution {
                          substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                          substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                      }
                  }
              }
          }
          EOF
          fi

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
