name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Project
        run: |
          npm ci || npm install
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          
          # Build your React/Vite project into production JavaScript
          npm run build

          # Ensure Capacitor Android platform exists
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Assets (If present)
        run: |
          if [ -d "assets" ]; then
            npx @capacitor/assets generate --android || echo "Asset generation failed, continuing..."
          fi

      - name: Sync Capacitor Platform
        run: |
          npx cap copy android
          npx cap sync android

      - name: Fix Kotlin Duplicate Dependencies
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            cat << 'EOF' >> $BUILD_GRADLE

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      dependencySubstitution {
                          substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                          substitute module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
                      }
                  }
              }
          }
          EOF
          fi

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=App Developer, OU=Dev, O=App, L=City, ST=State, C=US"

      - name: Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r3d-bucket/signing-action@v1.1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyFile: release-key.jks
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
