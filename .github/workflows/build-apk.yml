name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare Web Assets & Install Dependencies
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.js www/ 2>/dev/null || true
          cp -r *.css www/ 2>/dev/null || true
          cp -r *.png www/ 2>/dev/null || true
          npm install
          npx cap add android

      - name: Generate App Icon & Splash Screen
        run: |
          npx @capacitor/assets generate --android

      - name: Sync Capacitor Platform
        run: |
          npx cap copy android
          npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
